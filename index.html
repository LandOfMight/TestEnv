<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Land Of Might</title>
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="gameContainer">
    <canvas id="unity-canvas" data-pixel-art="{{OPTIMIZE_FOR_PIXEL_ART }}"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
      </div>
    </div>
    <script src="Build/LandOfMightBuild-y8.loader.js"></script>
    <script>
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var canvas = document.querySelector("#unity-canvas");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var logo = document.querySelector("#unity-logo");
      var config = {
        dataUrl: "Build/LandOfMightBuild-y8.data.unityweb",
        frameworkUrl: "Build/LandOfMightBuild-y8.framework.js.unityweb",
        codeUrl: "Build/LandOfMightBuild-y8.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Noah Kurtz",
        productName: "Land Of Might",
        productVersion: "3.75",
      };
      var scaleToFit;
      try {
        scaleToFit = !!JSON.parse("{{{ SCALE_TO_FIT }}}");
      } catch (e) {
        scaleToFit = true;
      }
      function progressHandler(progress) {
        var percent = progress * 100 + '%';
        progressBarFull.style.width = percent;
      }
      function onResize() {
        var container = canvas.parentElement;
        var w;
        var h;

        if (scaleToFit) {
          w = window.innerWidth;
          h = window.innerHeight;

          var r = 720 / 1280;

          if (w * r > window.innerHeight) {
            w = Math.min(w, Math.ceil(h / r));
          }
          h = Math.floor(w * r);
        } else {
          w = 1280;
          h = 720;
        }

        container.style.width = canvas.style.width = w + "px";
        container.style.height = canvas.style.height = h + "px";
        container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
        container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
        logo.style.left = Math.floor((w - 154) / 2) + "px"; // 154 is the width of the logo
        logo.style.top = Math.floor((h - 130) / 3) + "px";  // 130 is the height of the logo, divided by 3 for 33
      }
      var myGameInstance = null;
      createUnityInstance(canvas, config, progressHandler).then(function (instance) {
        loadingBar.style.display = 'none';
        myGameInstance = instance;
        canvas = instance.Module.canvas;
        fullscreenButton.onclick = () => {
          instance.SetFullscreen(1);
        };
        onResize();
      });
      window.addEventListener('resize', onResize);
      onResize();

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        const meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

    </script>
    <script type="text/javascript" src="TemplateData/gameBreakBeta.js"></script>
  </div>
</body>

</html>
